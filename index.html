<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>K비젼 태전점 렌즈 가격 확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Phone-first pickup order page: sticky shop bar, horizontal event strip, filter chips, compact product cards with steppers,
   a bottom cart bar that opens the cart sheet with the promo-applied total. Price check only: no request form (customers skipped the copy-paste step).
   Same navy / sale red / gift orange as the store's 아이북. */
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--soft:#F7F9FB;--seg:#E8ECF1;--line:#E3E7EC;
  --ink:#121A26;--muted:#5F6B7A;--faint:#98A2AF;
  --brand:#14305A;--brand-soft:#E8EEF7;--on-brand:#FFFFFF;
  --sale:#E2402C;--gift:#B4480C;--gift-soft:#FFF2E8;--ok:#14896B;--ok-soft:#E3F4EE;
  --kakao:#FEE500;--kakao-ink:#191919;
  --shadow:0 1px 2px rgba(18,26,38,.05),0 6px 18px rgba(18,26,38,.06);
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1217;--surface:#171C23;--soft:#1C222A;--seg:#232A33;--line:#2A313A;
  --ink:#E9EDF2;--muted:#A3ADB9;--faint:#7C8794;
  --brand:#8DB3EE;--brand-soft:#1D2A3D;--on-brand:#0E1217;
  --sale:#FF6B58;--gift:#FFA566;--gift-soft:#3A2618;--ok:#4CC9A4;--ok-soft:#15302A;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1217;--surface:#171C23;--soft:#1C222A;--seg:#232A33;--line:#2A313A;
  --ink:#E9EDF2;--muted:#A3ADB9;--faint:#7C8794;
  --brand:#8DB3EE;--brand-soft:#1D2A3D;--on-brand:#0E1217;
  --sale:#FF6B58;--gift:#FFA566;--gift-soft:#3A2618;--ok:#4CC9A4;--ok-soft:#15302A;
  --shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px 120px;display:grid;gap:16px}

/* shop bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);color:var(--on-brand)}
.bar-in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar b{display:block;font-size:17px;font-weight:800;letter-spacing:-.01em}
.bar small{font-size:12px;opacity:.85}
.bar a{flex:none;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:color-mix(in srgb,var(--on-brand) 18%,transparent);color:inherit;text-decoration:none}

/* intro */
.intro{margin:0;padding:12px 14px;border-radius:12px;background:var(--brand-soft);font-size:14px;line-height:1.6}
.intro b{color:var(--brand)}
/* old 3-step guide (unused) */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.how li{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-size:12px;color:var(--muted)}
.how b{font-size:14px;color:var(--ink)}
.how i{font-style:normal;font-size:11px;font-weight:800;color:var(--brand)}

/* events */
.evs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x mandatory}
.evs::-webkit-scrollbar{display:none}
.ev{flex:0 0 78%;max-width:300px;scroll-snap-align:start;display:grid;gap:4px;align-content:start;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left;box-shadow:var(--shadow);transition:background-color .15s,color .15s,transform .12s}
.ev b{font-size:16px;font-weight:800;line-height:1.35}
.ev span{font-size:13px;color:var(--muted)}
.ev[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.ev[aria-pressed="true"] span{color:var(--on-brand);opacity:.85}
.ev:active{transform:scale(.985)}

/* search + filters */
.find{display:grid;gap:10px;padding:12px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.search{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:0 14px;font-size:16px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;color:var(--ink);transition:background-color .15s,color .15s,transform .12s}
.chip small{font-weight:500;opacity:.65;margin-left:2px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip:active{transform:scale(.96)}
.sum{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);padding-inline:2px}
.sum button{border:0;background:none;color:var(--brand);font-weight:700;font-size:13px}

/* product cards */
.grp{display:grid;gap:10px}
.grp h2{margin:8px 0 0;font-size:19px;font-weight:800;letter-spacing:-.01em;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.grp h2 small{font-size:13px;font-weight:600;color:var(--faint);margin-left:6px}
.pc{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.pc.has{border-color:var(--brand)}
.pc-top{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start}
.ph{width:84px;aspect-ratio:1;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.ph span{font-size:11px;color:#98A2AF}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.chips span{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--seg);color:var(--muted)}
.pc h3{margin:0;font-size:17px;font-weight:800;line-height:1.35;letter-spacing:-.01em}
.mk{font-size:12px;color:var(--faint)}
.promo{margin:0;padding:7px 10px;border-radius:10px;background:var(--gift-soft);color:var(--gift);font-size:13px;font-weight:700}
.opts{display:grid;border-top:1px solid var(--line)}
.opt{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.opt:last-child{border-bottom:0;padding-bottom:0}
.q{font-size:14px;font-weight:700;color:var(--muted);min-width:42px}
.pr{display:grid;justify-items:end;line-height:1.2}
.pr s{font-size:12px;color:var(--faint)}
.pr b{font-size:20px;font-weight:800;color:var(--sale);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pr b small{font-size:13px;margin-left:1px}
.pr em{font-style:normal;font-size:11px;font-weight:700;color:var(--sale);opacity:.75}
.add{height:38px;padding:0 14px;border-radius:10px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand);font-size:14px;font-weight:800;white-space:nowrap;transition:transform .12s}
.add:active{transform:scale(.95)}
.step{display:inline-flex;align-items:center;height:38px;border-radius:10px;background:var(--brand);color:var(--on-brand);overflow:hidden}
.step button{width:36px;height:100%;border:0;background:none;color:inherit;font-size:20px;line-height:1}
.step output{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:16px}
.foot{font-size:12px;color:var(--faint);text-align:center}

/* bottom cart bar */
.cbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.cbar button{width:100%;max-width:696px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(18,26,38,.3);text-align:left}
.cbar .n{display:grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:999px;background:var(--sale);color:#fff;font-size:14px;font-weight:800}
.cbar .t{flex:1;display:grid;line-height:1.25}
.cbar .t small{font-size:12px;opacity:.75}
.cbar .t b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.cbar .go{padding:9px 14px;border-radius:12px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:800}

/* sheets */
.dim{position:fixed;inset:0;z-index:50;background:rgba(18,26,38,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:88%;display:flex;flex-direction:column;border-radius:22px 22px 0 0;background:var(--surface);max-width:720px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 2px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 18px 12px;border-bottom:1px solid var(--line)}
.sh-h h2{margin:0;font-size:20px;font-weight:800}
.x{border:0;background:var(--seg);border-radius:999px;width:34px;height:34px;font-size:16px;color:var(--muted)}
.sh-l{overflow:auto;padding:4px 18px;flex:1}
.ci{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ci .ph{width:52px;border-radius:10px}
.ci .k{font-size:12px;font-weight:700;color:var(--muted)}
.ci .nm{font-size:16px;font-weight:800;line-height:1.3}
.ci .r{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.ci .p{text-align:right;line-height:1.2}.ci .p s{display:block;font-size:12px;color:var(--faint)}.ci .p b{font-size:18px;font-weight:800;color:var(--sale);font-variant-numeric:tabular-nums}
.ci .note{grid-column:2;display:grid;gap:4px}
.tag{padding:6px 10px;border-radius:10px;font-size:13px;font-weight:700}
.tag.gift{background:var(--gift-soft);color:var(--gift)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.nudge{background:var(--brand-soft);color:var(--brand)}
.sh-f{padding:14px 18px 16px;display:grid;gap:6px;background:var(--soft);border-top:1px solid var(--line)}
.ln{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.ln b{color:var(--sale)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:6px}
.tot span{font-weight:700}.tot b{font-size:28px;font-weight:800;color:var(--sale);font-variant-numeric:tabular-nums}
.small{font-size:12px;color:var(--muted)}
.cta{height:52px;border:0;border-radius:14px;background:var(--brand);color:var(--on-brand);font-size:16px;font-weight:800;width:100%}
.cta:disabled{opacity:.45}
.link{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;justify-self:center}

/* pickup request */
.req{position:fixed;inset:0;z-index:70;overflow:auto;background:var(--bg)}
.req .wrap{padding-block:12px 32px}
.card{padding:18px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:12px}
.card h2{margin:0;font-size:19px;font-weight:800}
.card .sub{margin:-8px 0 0;font-size:13px;color:var(--muted)}
.it{width:100%;border-collapse:collapse;font-size:14px}
.it td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
.it td:last-child{text-align:right;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.it td small{display:block;color:var(--gift);font-weight:700;font-size:12px}
.paybox{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;border-top:2px solid var(--ink)}
.paybox b{font-size:26px;font-weight:800;color:var(--sale);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:700;color:var(--muted)}
.fld>span em{font-style:normal;color:var(--sale)}
.fld input,.fld textarea{width:100%;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:0 12px;font-size:16px}
.fld textarea{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.fld input[aria-invalid="true"]{border-color:var(--sale)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:84px;min-height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.err{margin:0;font-size:13px;font-weight:700;color:var(--sale)}
.notice{margin:0;padding:12px 14px;border-radius:12px;background:var(--brand-soft);font-size:13px;line-height:1.6}
.sendbox{display:grid;gap:8px}
.kk{display:flex;align-items:center;justify-content:center;height:54px;border-radius:14px;background:var(--kakao);color:var(--kakao-ink);font-size:16px;font-weight:800;text-decoration:none}
.btn2{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:800}
.copybox{width:100%;min-height:180px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 12px;font-size:14px;line-height:1.55}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600}
/* two products per row (사장님 요청 10-31); on phones the photo goes on top and the add button under the price */
.grp{grid-template-columns:repeat(2,minmax(0,1fr))}
.grp h2{grid-column:1/-1}
.pc{align-content:start}
@media (max-width:560px){
  .grp{gap:8px}
  .pc{padding:10px;gap:8px;border-radius:14px}
  .pc-top{grid-template-columns:1fr;gap:8px}
  .pc-top .ph{width:100%;aspect-ratio:16/10}
  .pc h3{font-size:15px}
  .chips span{font-size:10px;padding:1px 5px}
  .promo{font-size:12px;padding:6px 8px}
  .opt{grid-template-columns:auto minmax(0,1fr);gap:6px;padding:8px 0}
  .opt .ctl{grid-column:1/-1}
  .q{min-width:0;font-size:13px}
  .pr b{font-size:17px}
  .add{width:100%;height:36px}
  .step{display:flex;width:100%;height:36px;justify-content:space-between}
}
@media (max-width:380px){.how li{padding:8px 9px;font-size:11px}.how b{font-size:13px}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar"><div class="bar-in"><div><b id="shop">K비젼 태전점 콘택트렌즈</b><small>제품 금액 확인 · 행사 적용 금액을 미리 계산해 보세요</small></div></div></header>
<main class="wrap" id="main">
  <p class="intro">원하는 렌즈를 담으면 <b>행사가 적용된 금액</b>을 바로 계산해 드려요. 구매와 착용 확인은 매장에서 해요.</p>
  <div class="evs" id="evs"></div>
  <section class="find" aria-label="렌즈 찾기">
    <input class="search" id="q" type="search" placeholder="제품 이름으로 찾기 (예: 오아시스, 마이데이)" aria-label="제품 이름으로 찾기">
    <div class="row" id="f-use" role="group" aria-label="용도"></div>
    <div class="row" id="f-cyc" role="group" aria-label="착용 주기"></div>
    <div class="row" id="f-brand" role="group" aria-label="브랜드"></div>
  </section>
  <div class="sum" id="sum"></div>
  <div id="list" class="grp-list" style="display:grid;gap:18px"></div>
  <p class="foot" id="foot"></p>
</main>
<div class="cbar" id="cbar" hidden><button type="button" data-act="open-cart"><span class="n" id="cb-n">0</span><span class="t"><small id="cb-s"></small><b id="cb-t"></b></span><span class="go">금액 보기 →</span></button></div>

<div class="dim" id="dim" hidden data-act="close"></div>
<section class="sheet" id="cart" hidden role="dialog" aria-modal="true" aria-labelledby="cart-h">
  <div class="grab"></div>
  <div class="sh-h"><h2 id="cart-h">장바구니</h2><button type="button" class="x" data-act="close" aria-label="닫기">✕</button></div>
  <div class="sh-l" id="cart-l"></div>
  <div class="sh-f" id="cart-f"></div>
</section>

/* ----- promotions, worked out per cart line (one product, one pack size) -----
   A promo may hold several parts joined by " · "; a part starting with a pack size ("30P 3+1", "90P 1팩 구매 시 30P 증정") only counts for that pack.
   3+1: pay for three of every four; 쿠퍼비젼 repeats, others once (4팩까지).
   "90P 2팩 구매 시 30P 증정": two of that pack size bring one small pack of the same product, once (쿠퍼비젼 "90P 1팩 → 30P" repeats per pack);
   네이버페이 2만원 is added where the promo says so.
   "3팩 구매 시 1팩 증정": three packs bring one more of the same pack, once.
   "앱 쿠폰" promos (바슈롬, 11월) need the customer's own coupon, so they are noted, not taken off the total. */
function calc(pi,oi,q){
  var p=P[pi],o=p.opts[oi],all=p.promo||'',unit=amt(o.sale),listU=amt(o.list);
  if(unit==null)unit=listU;if(listU==null)listU=unit;
  /* the free pack is counted inside the quantity: 4 boxes of a 3+1 cost 3; a gift pack the customer also puts in the cart costs 0 */
  var r={q:q,paid:q,free:0,freeLabel:'',gifts:[],nudge:'',note:'',unit:unit,giftSize:null,giftText:'',giftN:0};
  var m,pk=qlab(o.qty),pr='';
  if(/앱 쿠폰/.test(all)){r.note='바슈롬 앱 쿠폰을 받아 오시면 매장에서 행사를 적용해 드려요';all=''}
  all.split(/\s*·\s*/).forEach(function(sg){if(pr)return;var mm=/^(\d+P)\s/.exec(sg);if(mm&&mm[1]!==pk)return;if(/\d\s*\+\s*\d|증정/.test(sg)&&!/^네이버페이/.test(sg))pr=sg});
  var npayAll=/네이버페이/.test(all);
  if(/3\s*\+\s*1/.test(pr)){
    var rep=p.brand==='쿠퍼비젼';
    r.free=rep?Math.floor(q/4):(q>=4?1:0);
    if(r.free)r.freeLabel='3+1 적용 · '+r.free+'팩 무료';
    if(rep?q%4===3:q===3)r.nudge='1팩 더 담으면 1팩 무료예요';
    if(!rep&&q>4)r.note='3+1은 4팩까지 1번만 적용돼요';
  }else if((m=/(\d+P)\s*(\d+)팩 구매 시\s*(?:같은 제품\s*)?(\d+P)\s*(?:1팩\s*)?증정/.exec(pr))){
    var npay=npayAll,n=+m[2];
    if(qlab(o.qty)===m[1]){
      if(m[1]===m[3]){
        /* gift is the same pack (30P 2+1, 6P 3+1): the next pack after n is free */
        if(q>=n+1){r.free=1;r.freeLabel=n+'+1 적용 · 1팩 무료';if(npay)r.gifts.push('네이버페이 2만원');if(q>n+1)r.note='증정은 1번만 적용돼요'}
        else if(q===n)r.nudge='1팩 더 담으면 1팩 무료'+(npay?' + 네이버페이 2만원':'');
      }else{
        /* gift is a smaller pack of the same product (90P 2팩 → 30P 1팩) */
        var each=p.brand==='쿠퍼비젼'&&n===1; /* 쿠퍼 멤버십: every 90P pack brings a 30P pack */
        if(q>=n){r.giftSize=m[3];r.giftN=each?q:1;r.giftText=p.name+' '+m[3]+' '+r.giftN+'팩';r.gifts.push(r.giftText);if(npay)r.gifts.push('네이버페이 2만원');if(q>n&&!each)r.note='증정은 1번만 적용돼요'}
        else if(q===n-1)r.nudge='1팩 더 담으면 '+m[3]+' 1팩'+(npay?' + 네이버페이 2만원':'')+' 증정';
      }
    }
  }else if((m=/(\d+)팩 구매 시 1팩 증정/.exec(pr))){
    var n2=+m[1];
    if(q>=n2+1){r.free=1;r.freeLabel=n2+'+1 적용 · 1팩 무료';if(q>n2+1)r.note='증정은 1번만 적용돼요'}
    else if(q===n2)r.nudge='1팩 더 담으면 1팩 무료';
  }
  r.paid=q-r.free;
  r.pay=unit==null?null:r.paid*unit;
  r.list=listU==null?null:q*listU;
  return r;
}
function lines(){
  var ls=Object.keys(cart).filter(function(k){return cart[k]>0}).map(function(k){var a=k.split(':'),pi=+a[0],oi=+a[1];return {k:k,pi:pi,oi:oi,p:P[pi],o:P[pi].opts[oi],c:calc(pi,oi,cart[k])}});
  /* 90P 2팩 + the same product's 30P in the cart: that 30P pack is the gift, so one of it is free instead of a separate gift line */
  ls.forEach(function(l){
    if(!l.c.giftSize)return;
    var g=ls.filter(function(x){return x!==l&&x.pi===l.pi&&qlab(x.o.qty)===l.c.giftSize})[0];
    if(!g)return;
    var k=Math.min(l.c.giftN||1,g.c.q-g.c.free);if(k<1)return;
    var left=(l.c.giftN||1)-k,i=l.c.gifts.indexOf(l.c.giftText);
    if(i>=0){if(left>0)l.c.gifts[i]=l.p.name+' '+l.c.giftSize+' '+left+'팩';else l.c.gifts.splice(i,1)}
    g.c.free+=k;g.c.paid=g.c.q-g.c.free;g.c.pay=g.c.unit==null?null:g.c.paid*g.c.unit;
    g.c.freeLabel=(g.c.freeLabel?g.c.freeLabel+' · ':'')+'증정 적용 · '+k+'팩 무료';
  });
  return ls;
}
function totals(ls){
  var pay=0,list=0,box=0,ask=0,gifts=0;
  ls.forEach(function(l){box+=l.c.q;gifts+=l.c.gifts.length;if(l.c.pay==null){ask++;return}pay+=l.c.pay;list+=l.c.list==null?l.c.pay:l.c.list});
  return {pay:pay,list:list,off:list-pay,box:box,ask:ask,gifts:gifts};
}

/* ----- list ----- */
function matches(p){
  if(F.ev!==null){return evSet(D.events[F.ev]).indexOf(p)>=0}
  if(F.use!=='전체'&&!(F.use==='근시'?p.myopia:F.use==='난시'?p.astig:F.use==='멀티포컬'?p.multi:p.color))return false;
  if(F.cyc!=='전체'&&p.cyc!==F.cyc)return false;
  if(F.brand!=='전체'&&p.brand!==F.brand)return false;
  if(F.q){var t=(p.name+' '+p.brand+' '+p.maker+' '+p.promo).toLowerCase().replace(/\s/g,'');if(t.indexOf(F.q)<0)return false}
  return true;
}
/* an event card shows the products it talks about: brands named in its title, narrowed to products whose promo shares its numbers */
function evSet(e){
  var t=e.title,txt=t+' '+e.text,bs=[];
  P.forEach(function(p){if(bs.indexOf(p.brand)<0&&(t.indexOf(p.brand)>=0||(p.brand==='쿠퍼비젼'&&/쿠퍼/.test(t))))bs.push(p.brand)});
  var tok=(txt.match(/\d+\s*\+\s*\d+|\d+팩|\d+P/g)||[]).map(function(x){return x.replace(/\s/g,'')});
  var inB=P.filter(function(p){return !bs.length||bs.indexOf(p.brand)>=0});
  var hit=inB.filter(function(p){var pr=String(p.promo||'').replace(/\s/g,'');return pr&&tok.some(function(k){return pr.indexOf(k)>=0})});
  return hit.length?hit:(bs.length?inB:[]);
}
function ctl(k){
  var q=cart[k]||0;
  return q?'<span class="step"><button type="button" data-act="dec" data-k="'+k+'" aria-label="하나 빼기">−</button><output>'+q+'</output><button type="button" data-act="inc" data-k="'+k+'" aria-label="하나 더">+</button></span>'
    :'<button type="button" class="add" data-act="inc" data-k="'+k+'">+ 담기</button>';
}
function card(p){
  var pi=P.indexOf(p),has=p.opts.some(function(o,oi){return cart[pi+':'+oi]});
  var chips=[p.cycLabel,p.color?'컬러':'투명',p.astig?'난시':'',p.multi?'멀티포컬':''].filter(Boolean).map(function(c){return '<span>'+esc(c)+'</span>'}).join('');
  return '<article class="pc'+(has?' has':'')+'" data-pi="'+pi+'"><div class="pc-top"><div class="ph">'+(p.pic?'<img src="'+esc(p.pic)+'" alt="'+esc(p.name)+'" loading="lazy">':'<span>사진 준비 중</span>')+'</div>'+
    '<div><div class="chips">'+chips+'</div><h3>'+esc(p.name)+'</h3>'+(p.maker&&p.maker!==p.brand?'<div class="mk">'+esc(p.maker)+'</div>':'')+'</div></div>'+
    (p.promo?'<p class="promo">'+esc(p.promo)+'</p>':'')+
    '<div class="opts">'+p.opts.map(function(o,oi){
      var l=amt(o.list),s=amt(o.sale),off=l&&s!=null&&s<l?Math.round((1-s/l)*100):0,k=pi+':'+oi;
      var price=s!=null?'<b>'+won(s)+'<small>원</small></b>':(o.sale?'<b>'+esc(o.sale)+'</b>':(l!=null?'<b>'+won(l)+'<small>원</small></b>':'<b>문의</b>'));
      return '<div class="opt"><span class="q">'+esc(qlab(o.qty))+'</span><span class="pr">'+(off?'<s>'+won(l)+'원</s>':'')+price+(off?'<em>'+off+'% 할인</em>':'')+'</span><span class="ctl" data-c="'+k+'">'+ctl(k)+'</span></div>';
    }).join('')+'</div></article>';
}
function chipRow(id,key,vals,counts){
  $(id).innerHTML=vals.map(function(v){return '<button type="button" class="chip" data-act="f" data-key="'+key+'" data-v="'+esc(v)+'" aria-pressed="'+(F.ev===null&&F[key]===v)+'">'+esc(v)+(counts?'<small>'+counts[v]+'</small>':'')+'</button>'}).join('');
}
function renderList(){
  var brands=[];P.forEach(function(p){if(brands.indexOf(p.brand)<0)brands.push(p.brand)});
  var cnt={'전체':0};brands.forEach(function(b){cnt[b]=0});
  P.forEach(function(p){var save=F.brand;F.brand='전체';if(F.ev===null&&matches(p)){cnt['전체']++;cnt[p.brand]++}F.brand=save});
  chipRow('f-use','use',['전체','근시','난시','멀티포컬','컬러']);
  chipRow('f-cyc','cyc',['전체','원데이','2주·한달','장기·기타']);
  chipRow('f-brand','brand',['전체'].concat(brands),cnt);
  $('evs').innerHTML=D.events.map(function(e,i){return '<button type="button" class="ev" data-act="ev" data-i="'+i+'" aria-pressed="'+(F.ev===i)+'"><b>'+esc(e.title)+'</b><span>'+esc(e.text)+'</span></button>'}).join('');
  var shown=P.filter(matches);
  $('sum').innerHTML='<span>'+(F.ev!==null?'행사 제품 · '+esc(D.events[F.ev].title):'제품 '+shown.length+'개')+'</span>'+(F.ev!==null||F.q||F.use!=='전체'||F.cyc!=='전체'||F.brand!=='전체'?'<button type="button" data-act="reset">전체 보기</button>':'');
  $('list').innerHTML=shown.length?brands.map(function(b){var its=shown.filter(function(p){return p.brand===b});return its.length?'<section class="grp"><h2>'+esc(b)+'<small>'+its.length+'개</small></h2>'+its.map(card).join('')+'</section>':''}).join('')
    :'<p class="empty">찾는 제품이 없어요. 다른 이름으로 찾거나 [전체 보기]를 눌러 주세요.</p>';
}
function refreshCart(changedKey){
  persist();
  if(changedKey){
    var span=document.querySelector('[data-c="'+changedKey+'"]');if(span)span.innerHTML=ctl(changedKey);
    var pi=changedKey.split(':')[0],art=document.querySelector('.pc[data-pi="'+pi+'"]');
    if(art)art.classList.toggle('has',P[+pi].opts.some(function(o,oi){return cart[pi+':'+oi]}));
  }
  var ls=lines(),t=totals(ls);
  $('cbar').hidden=!ls.length;
  $('cb-n').textContent=ls.length;
  $('cb-s').textContent='장바구니 · '+t.box+'팩'+(t.gifts?' (+증정)':'');
  $('cb-t').textContent=won(t.pay)+'원'+(t.ask?' + 문의':'');
  if(!$('cart').hidden)renderCart();
}

/* ----- cart sheet ----- */
function renderCart(){
  var ls=lines(),t=totals(ls);
  if(!ls.length){$('cart-l').innerHTML='<p class="empty" style="margin:16px 0">장바구니가 비어 있어요.</p>';$('cart-f').innerHTML='<button type="button" class="cta" data-act="close">제품 고르러 가기</button>';return}
  $('cart-l').innerHTML=ls.map(function(l){
    var c=l.c,tags=c.gifts.map(function(g){return '<span class="tag gift">증정 · '+esc(g)+'</span>'}).join('')+
      (c.freeLabel?'<span class="tag ok">'+esc(c.freeLabel)+'</span>':'')+(c.nudge?'<span class="tag nudge">'+esc(c.nudge)+'</span>':'')+(c.note?'<span class="tag nudge">'+esc(c.note)+'</span>':'');
    return '<div class="ci"><div class="ph">'+(l.o.pic||l.p.pic?'<img src="'+esc(l.o.pic||l.p.pic)+'" alt="">':'')+'</div><div><div class="k">'+esc(l.p.brand)+' · '+esc(qlab(l.o.qty))+'</div><div class="nm">'+esc(l.p.name)+'</div>'+
      '<div class="r">'+ctl(l.k)+'<span class="p">'+(c.list!=null&&c.pay!=null&&c.list>c.pay?'<s>'+won(c.list)+'원</s>':'')+'<b>'+(c.pay==null?'가격 문의':won(c.pay)+'원')+'</b></span></div></div>'+(tags?'<div class="note">'+tags+'</div>':'')+'</div>';
  }).join('');
  var newbie=D.events.filter(function(e){return /신규/.test(e.title)})[0];
  $('cart-f').innerHTML='<div class="ln"><span>정상가 합계</span><span>'+won(t.list)+'원</span></div><div class="ln"><span>할인</span><b>−'+won(t.off)+'원</b></div>'+
    '<div class="tot"><span>예상 결제 금액</span><b>'+won(t.pay)+'원</b></div>'+(t.ask?'<span class="small">가격 문의 제품은 매장에서 안내해 드려요.</span>':'')+
    (newbie?'<span class="small">처음 오신 분 혜택('+esc(newbie.text)+')은 매장에서 확인 후 적용해 드려요.</span>':'')+
    '<p class="notice" style="margin-top:6px">구매하실 때 <b>이 화면을 매장 직원에게 보여 주세요.</b> 재고와 행사는 매장에서 한 번 더 확인해 드려요.</p><button type="button" class="link" data-act="clear">장바구니 비우기</button>';
}

/* ----- open / close ----- */
function show(which){
  $('dim').hidden=which!=='cart';$('cart').hidden=which!=='cart';
  document.body.style.overflow=which?'hidden':'';
  if(which==='cart')renderCart();
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,k=el.dataset.k;
  if(a==='inc'){cart[k]=Math.min(20,(cart[k]||0)+1);refreshCart(k)}
  else if(a==='dec'){cart[k]=(cart[k]||0)-1;if(cart[k]<=0)delete cart[k];refreshCart(k)}
  else if(a==='f'){F.ev=null;F[el.dataset.key]=el.dataset.v;renderList()}
  else if(a==='ev'){var i=+el.dataset.i;F.ev=F.ev===i?null:i;renderList();var s=$('sum');if(s&&F.ev!==null)s.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='reset'){F={use:'전체',cyc:'전체',brand:'전체',q:'',ev:null};$('q').value='';renderList()}
  else if(a==='open-cart')show('cart');
  else if(a==='close')show(null);
  else if(a==='clear'){cart={};refreshCart();renderList();show(null)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('cart').hidden)show(null)});
$('q').addEventListener('input',function(){F.ev=null;F.q=this.value.toLowerCase().replace(/\s/g,'');renderList()});

renderList();refreshCart();
})();
</script>

</html>
